[package]
name = "vrcx-0-web"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Browser host for VRCX-0"

[dependencies]
axum = "0.8"
futures-util = "0.3"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vrcx-0-runtime-host-desktop = { path = "../runtime-host-desktop" }
vrcx-0-application = { path = "../application" }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-application-activity = { path = "../application-activity" }
vrcx-0-application-game = { path = "../application-game" }
vrcx-0-application-realtime = { path = "../application-realtime" }
vrcx-0-contracts = { path = "../contracts" }
vrcx-0-core = { path = "../core" }
vrcx-0-composition = { path = "../composition" }
vrcx-0-platform = { path = "../platform" }
vrcx-0-host-desktop = { path = "../host-desktop" }
vrcx-0-persistence = { path = "../persistence" }
vrcx-0-local-server = { path = "../local-server" }
vrcx-0-integration-api = { path = "../integration-api" }
vrcx-0-mcp = { path = "../mcp" }
vrcx-0-assistant = { path = "../assistant" }
vrcx-0-vrchat-client = { path = "../vrchat-client" }

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
