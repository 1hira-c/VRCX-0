name: VRCX-0 Web
version: '0.1.1'
slug: vrcx_0_web
description: VRCX-0 in your browser, with a persistent Rust data runtime.
stage: experimental
url: https://github.com/1hira-c/VRCX-0/tree/codex/web-haos/home-assistant/vrcx-0
arch:
    - aarch64
    - amd64
image: ghcr.io/1hira-c/vrcx-0-web-{arch}
startup: application
boot: auto
init: true
timeout: 30
ingress: true
ingress_port: 8080
ingress_stream: true
panel_icon: mdi:account-group
ports:
    8080/tcp: null
ports_description:
    8080/tcp: Optional direct HTTP access (prefer Ingress or a TLS reverse proxy)
watchdog: http://[HOST]:[PORT:8080]/healthz
backup: cold
options: {}
schema: {}
